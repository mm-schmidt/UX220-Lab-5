<!DOCTYPE html>
<HTML lang="en">

<head>
    <title>UX 220 - Lab 5</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Boldonse&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        p {
            font-family: "Raleway", sans-serif;
        }

        header {
            font-family: "Raleway", sans-serif;
        }
    </style>
</head>

<body>

    <header>
        <x-center>
            <h1>Custom Elements</h1>
        </x-center>
    </header>

    <main>
        <x-center>
            <p>This article uses the custom element x-center to center align the text.</p>
        </x-center>
    </main>

    <script>
        class XCenter extends HTMLElement {
            connectedCallback() {
                Object.assign(this.style, {
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    textAlign: "center"
                });
            }
        }

        customElements.define("x-center", XCenter);
    </script>

</body>

</HTML>
